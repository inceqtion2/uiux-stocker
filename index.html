      <button type="button" class="side-x" id="sideClose" aria-label="メニューを閉じる">×</button>
    </div>
    <div class="side-cta">
    <button type="button" class="btn primary block cta" data-add><span class="plus" aria-hidden="true">＋</span>Add Card</button>
    <button type="button" class="btn block cta2" data-go="stack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="15" width="14" height="5" rx="1.5"/><rect x="3" y="9" width="14" height="5" rx="1.5" transform="rotate(-4 10 11.5)"/><rect x="6" y="3" width="13" height="5" rx="1.5" transform="rotate(3 12 5.5)"/></svg>Stack</button>
    </div>
    <section class="side-sec" aria-labelledby="sTags"><h2 id="sTags">Tags<span>分野ごとのカードを見る</span></h2><ul class="taglist" id="sideTags"></ul></section>
    <button type="button" class="side-rank" id="sideRank" data-go="profile" hidden></button>
  </aside>
  <div class="side-scrim" id="sideScrim" hidden></div>

  <div class="main">
    <header class="mtop">
      <button type="button" class="hamb" id="hamb" aria-label="メニューを開く" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="spacer"></span>
      <button type="button" class="btn small mstack" data-go="stack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="15" width="14" height="5" rx="1.5"/><rect x="3" y="9" width="14" height="5" rx="1.5" transform="rotate(-4 10 11.5)"/><rect x="6" y="3" width="13" height="5" rx="1.5" transform="rotate(3 12 5.5)"/></svg>Stack</button>
      <button type="button" class="btn small primary" data-add aria-label="Add Card">＋<span class="long" aria-hidden="true"> Add Card</span></button>
    </header>

    <section class="stage" id="vStage" aria-label="ホーム">
      <div class="pile" id="pile" role="group" aria-label="カードの山。Tabキーで順にたどれます"></div>
      <div class="gridwrap" id="gridwrap" hidden><div class="inner" id="gridInner"></div></div>
      <button type="button" class="layout-fab" id="layoutFab" hidden></button>
      <div class="overlay" id="overlay">
        <form class="search" id="sform" role="search">
          <div class="sbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <label for="q" class="vh">言葉や、困っている場面で探す</label>
            <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="言葉や、困っている場面で探す" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
            <kbd class="kbd" id="qKbd" aria-hidden="true">/</kbd>
            <button type="button" class="clear" id="clearQ" aria-label="検索をやめる" hidden>×</button>
          </div>
          <button class="go" type="submit" aria-label="探す">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          </button>
          <div class="sugg" id="sugg" role="listbox" aria-label="候補" hidden></div>
        </form>
        <div class="st-head" id="stHead"><p class="help">用語集をひらいています…</p></div>
      </div>
    </section>

    <section class="page" id="vStack" hidden aria-label="Stack"><div class="page-in" id="stackIn"></div></section>
    <section class="page" id="vProfile" hidden aria-label="プロフィール"><div class="page-in" id="profileIn"></div></section>
  </div>
</div>

<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTerm"></aside>
</div>

<div class="backdrop" id="sheetWrap" hidden>
  <form class="sheet nc t-none" id="cardForm" aria-labelledby="sheetTitle" novalidate>
    <div class="nc-head">
      <div class="nc-bar"><span class="nc-kicker" id="sheetTitle">New Card</span><span class="spacer"></span><button type="button" class="dc-btn" id="fX" aria-label="閉じる">×</button></div>
      <label for="fName" class="vh">言葉</label>
      <input type="text" id="fName" class="nc-word" required placeholder="出会った言葉" autocomplete="off" enterkeyhint="done">
      <label for="fAlias" class="vh">英語名・別名</label>
      <input type="text" id="fAlias" class="nc-alias" placeholder="English name" autocomplete="off">
      <p class="err" id="fNameErr" hidden role="alert">言葉を入れてください。</p>
      <div class="dup" id="fDup" hidden role="status"></div>
      <p class="draft-note" id="draftNote" hidden>書きかけの内容を戻しました <button type="button" class="link" id="draftClear">消す</button></p>
    </div>
    <div class="nc-body">
      <div class="field">
        <label for="fMeaning">Meaning<span class="opt" id="fMeanHint" aria-live="polite"></span></label>
        <textarea id="fMeaning" rows="3" placeholder="ひとことで。あとからでもOK"></textarea>
      </div>
      <fieldset class="field">
        <legend><span id="fTagsLegend">Tags</span><span class="opt" id="fTagsHint"></span></legend>
        <div class="tagpick" id="fTags"></div>
        <div><button type="button" class="link" id="fTagsMore" hidden>ほかのタグ</button></div>
      </fieldset>
      <div class="attach-chips" role="group" aria-label="追加する項目">
        <button type="button" class="ach multi" data-sec="secUrl" aria-controls="secUrl" aria-label="URLを追加">URL</button>
        <button type="button" class="ach" data-sec="secFile" aria-expanded="false" aria-controls="secFile">添付ファイル</button>
        <button type="button" class="ach" data-sec="secMemo" aria-expanded="false" aria-controls="secMemo">メモ</button>
      </div>
      <section class="refbox" id="refBox" hidden aria-labelledby="refBoxH">
        <span class="flabel" id="refBoxH">Reference<span class="opt">出典・URL・ファイル</span></span>
        <div class="ref-official" id="fSrc" hidden></div>
      <div class="asec" id="secUrl" hidden>
        <span class="sublabel">URL</span>
        <div class="refs" id="fRefs"></div>
      </div>
      <div class="asec" id="secFile" hidden>
        <span class="sublabel">Files<span class="opt">画像・PDFなど。画像は自動で軽くします</span></span>
        <ul class="files" id="fFiles"></ul>
        <label class="btn small file-btn"><input type="file" id="fFileIn" multiple accept="image/*,application/pdf,.txt,.md">ファイルを選ぶ</label>
      </div>
      </section>
      <div class="asec field" id="secMemo" hidden>
        <label for="fNote">Memo<span class="opt">自分の言葉で</span></label>
        <textarea id="fNote" placeholder="例：得する話より、損する話のほうが心に刺さる"></textarea>
      </div>
      <button type="button" class="danger" id="fDelete" hidden>このカードを削除</button>
    </div>
    <div class="sheet-foot">
      <button type="button" class="cancel" id="fCancel">Cancel</button>
      <button type="submit" class="save" id="fSave">Save</button>
    </div>
  </form>
</div>

<p class="vh" id="liveResult" aria-live="polite"></p>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button type="button" id="toastAct" hidden></button></div>
